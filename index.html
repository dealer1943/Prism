<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <aside class="panel">
        <h2>Prism</h2>
        <p class="tag">Light lab · white only</p>
        <div class="tools" id="tools">
          <button type="button" data-tool="laser" class="active">1 Laser</button>
          <button type="button" data-tool="mirror">2 Mirror</button>
          <button type="button" data-tool="prism">3 Prism</button>
          <button type="button" data-tool="move">M Move</button>
          <button type="button" data-tool="rotate">R Rotate</button>
          <button type="button" data-tool="erase">E Erase</button>
        </div>
        <select id="tool" hidden>
          <option value="laser" selected>laser</option>
          <option value="mirror">mirror</option>
          <option value="prism">prism</option>
          <option value="move">move</option>
          <option value="rotate">rotate</option>
          <option value="erase">erase</option>
        </select>
        <button id="clear" type="button" class="danger">Clear lab</button>
        <p class="note">
          Drag optics to move. Scroll to aim. Prisms use enter/exit refraction with TIR.
          S3 will add save/load layouts.
        </p>
      </aside>
      <div id="hud" class="hud">Loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
