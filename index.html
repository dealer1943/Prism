<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <aside class="panel">
        <h2>Prism</h2>
        <p class="tag">Light lab · white only</p>
        <label>Tool
          <select id="tool">
            <option value="laser">1 · Laser</option>
            <option value="mirror">2 · Mirror</option>
            <option value="prism">3 · Prism</option>
            <option value="move">M · Move</option>
            <option value="rotate">R · Rotate</option>
            <option value="erase">E · Erase</option>
          </select>
        </label>
        <button id="clear" type="button">Clear lab</button>
        <p class="note">
          Top-down black room. Place optics, drag to move, scroll to rotate.
          Beams stay white. Sections ship independently — S1 laser+mirrors solid; prisms refine in S2.
        </p>
      </aside>
      <div id="hud" class="hud">Loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
