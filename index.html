<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <aside class="panel">
        <h2>Prism</h2>
        <p class="tag">Light lab · white → ROYGBIV split</p>
        <div class="tools" id="tools">
          <button type="button" data-tool="laser" class="active">1 Laser</button>
          <button type="button" data-tool="mirror">2 Mirror</button>
          <button type="button" data-tool="prism">3 Prism</button>
          <button type="button" data-tool="move">M Move</button>
          <button type="button" data-tool="erase">E Erase</button>
        </div>
        <select id="tool" hidden>
          <option value="laser" selected>laser</option>
          <option value="mirror">mirror</option>
          <option value="prism">prism</option>
          <option value="move">move</option>
          <option value="erase">erase</option>
        </select>
        <div class="persist">
          <button id="save" type="button">Save</button>
          <button id="load" type="button">Load</button>
          <button id="export" type="button">Export JSON</button>
          <button id="import" type="button">Import JSON</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </div>
        <button id="clear" type="button" class="danger">Clear lab</button>
        <p class="note">
          Right-click an optic for the aim dial (1°). Double-click for Clone
          (mirrors/prisms). White beams split into ROYGBIV on prism exit.
        </p>
      </aside>
      <div id="hud" class="hud">Loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
